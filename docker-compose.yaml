services:
  inventory-db:
    image: postgres:17
    environment:
      POSTGRES_DB: orderflow-inventory
      POSTGRES_USER: ${DB_USERNAME:-orderflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orderflow-local}
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  order-db:
    image: postgres:17
    environment:
      POSTGRES_DB: orderflow-order
      POSTGRES_USER: ${DB_USERNAME:-orderflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orderflow-local}
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: inventory
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-orderflow}
      DB_PASSWORD: ${DB_PASSWORD:-orderflow-local}
    ports:
      - "${INVENTORY_HTTP_PORT:-8080}:8081"
    depends_on:
      inventory-db:
        condition: service_healthy

  order:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: order
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${DB_USERNAME:-orderflow}
      DB_PASSWORD: ${DB_PASSWORD:-orderflow-local}
    ports:
      - "${ORDER_HTTP_PORT:-8081}:8080"
    depends_on:
      order-db:
        condition: service_healthy
      inventory:
        condition: service_started

