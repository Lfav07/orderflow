syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.orderflow.inventory.grpc";

message StockOperationRequest {
  string operation_id = 1;
  string product_id = 2;
  string quantity = 3;
}

message StockOperationResponse {
  string temp = 1;
}

service StockService {
  rpc DebitStock(StockOperationRequest)
      returns (StockOperationResponse);
  rpc ReturnStock(StockOperationRequest)
      returns (StockOperationResponse);
}
