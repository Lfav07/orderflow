syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.orderflow.inventory.grpc";

message StockOperationRequest {
  string operation_id = 1;
  string product_id = 2;
  string quantity = 3;
}
enum StockOperationType {
  STOCK_OPERATION_TYPE_UNSPECIFIED = 0;
  DEBIT = 1;
  RETURN = 2;
  ADJUSTMENT_IN = 3;
  ADJUSTMENT_OUT = 4;
}

message StockOperationResponse {
  string operation_id = 1;
  string product_id = 2;
  string quantity = 3;
  StockOperationType type = 4;
  string created_at = 5;
}

message CheckStockAvailabilityRequest {
  string product_id = 1;
  string quantity = 2;
}

message CheckStockAvailabilityResponse {
  string product_id = 1;
  bool available = 2;
}

service StockService {
  rpc DebitStock(StockOperationRequest)
      returns (StockOperationResponse);
  rpc ReturnStock(StockOperationRequest)
      returns (StockOperationResponse);
  rpc CheckStockAvailability(CheckStockAvailabilityRequest)
      returns (CheckStockAvailabilityResponse);
}

message GetProductPriceRequest {
  string product_id = 1;
}

message GetProductPriceResponse {
  string product_id = 1;
  string unit_price = 2;
}

service ProductService {
  rpc GetProductPrice(GetProductPriceRequest)
      returns (GetProductPriceResponse);
}
