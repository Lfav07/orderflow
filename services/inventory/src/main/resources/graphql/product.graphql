type Product {
    id: ID!
    name: String!
    description: String
    quantityInStock: BigDecimal!
    unit: ProductUnit!
    pricePerUnit: BigDecimal!
    status: ProductStatus!
    createdAt: DateTime!
    updatedAt: DateTime!
}

input CreateProductInput {
    name: String!
    description: String
    quantityInStock: BigDecimal!
    unit: ProductUnit!
    pricePerUnit: BigDecimal!
    status: ProductStatus!
}

input ChangeProductDescriptionInput {
    id: ID!
    description: String
}

input ChangeProductNameInput {
    id: ID!
    name: String!
}

input ChangeProductPriceInput {
    id: ID!
    pricePerUnit: BigDecimal!
}

input ChangeProductUnitInput {
    id: ID!
    unit: ProductUnit!
}

input ChangeStockInput {
    id: ID!
    quantity: BigDecimal!
}

input FilterProductsInput {
    status: ProductStatus
    name: String
    unit: ProductUnit
    page: Int = 0
    size: Int = 20
}

input GetProductByIdInput {
    id: ID!
}

input ListProductsInput {
    page: Int = 0
    size: Int = 20
}

input ProductIdInput {
    id: ID!
}

type Query {
    productById(input: GetProductByIdInput!): Product!
    listProducts(input: ListProductsInput!): [Product!]!
    filterProducts(input: FilterProductsInput!): [Product!]!
    availableStock(input: ProductIdInput!): BigDecimal!
}

type Mutation {
    createProduct(input: CreateProductInput!): Product!
    changeProductDescription(input: ChangeProductDescriptionInput!): Product!
    changeProductName(input: ChangeProductNameInput!): Product!
    changeProductPrice(input: ChangeProductPriceInput!): Product!
    changeProductUnit(input: ChangeProductUnitInput!): Product!
    increaseStock(input: ChangeStockInput!): Product!
    decreaseStock(input: ChangeStockInput!): Product!
    activateProduct(input: ProductIdInput!): Product!
    deactivateProduct(input: ProductIdInput!): Product!
}

scalar BigDecimal
scalar DateTime
enum ProductUnit{
    GRAMS
    KILOGRAMS
    LITERS
    MILLILITERS
    UNITS
}
enum ProductStatus{
    ACTIVE
    INACTIVE
}
